site_name: Sito di Studio
site_description: Appunti e materiale di studio personale, organizzati in moduli.
# URL pubblico su GitHub Pages: serve per canonical/sitemap corretti.
# Il sito resta comunque navigabile anche da Docker/LAN (link relativi).
site_url: https://namelessideas.github.io/sito-studio/
docs_dir: docs

# La home (index.md) resta costruita e raggiungibile dal logo/titolo del sito,
# ma è esclusa dalla navigazione: non compare nel menu laterale e non entra
# nella sequenza Precedente/Successivo (così dalle materie non si torna alla
# home dal footer). NB: non è un blocco "nav:", la nav resta automatica.
not_in_nav: |
  /index.md
  /privacy.md

# Link "Privacy" nel footer di ogni pagina (chiave copyright di Material).
# URL canonico assoluto: il footer compare a profondità diverse e il sito vive
# sia su Pages (sottocartella) sia in Docker/LAN (radice).
copyright: >
  <a href="https://namelessideas.github.io/sito-studio/privacy/">Privacy</a>

# Nessun blocco "nav:": la navigazione è generata AUTOMATICAMENTE dalla
# struttura di docs/. Aggiungere una materia = creare una cartella.
# Aggiungere un argomento = creare un file .md dentro quella cartella.

theme:
  name: material
  language: it
  # font: false = nessuna richiesta a fonts.googleapis.com (GDPR). Roboto e
  # Roboto Mono sono self-hosted in docs/fonts/ e dichiarati in extra.css.
  font: false
  features:
    - navigation.instant          # navigazione in stile SPA: niente ricaricamento pagina
    - navigation.instant.progress # sottile barra di avanzamento sui caricamenti lenti
    - navigation.tracking         # l'ancora nell'URL segue la sezione mentre scorri
    # NIENTE navigation.tabs: le materie non vanno "in fila" nella barra in alto.
    # Compaiono invece nel menu laterale a sinistra (espandibile). La home non
    # diventa quindi un tab: per tornarci basta il logo/titolo del sito.
    - navigation.top              # bottone "torna su" con scroll morbido
    - navigation.footer           # link Precedente/Successivo in fondo (escluso dove hide: footer)
    - navigation.indexes          # ogni materia: l'index.md è la landing cliccabile
    # NIENTE navigation.expand: non vogliamo TUTTI i rami sempre aperti. Restano
    # aperti solo i rami che l'utente apre, anche cambiando pagina: lo stato è
    # ricordato da docs/javascripts/nav-persist.js (vedi extra_javascript).
    - toc.follow                  # la table of contents segue la lettura
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link           # cambiare un content-tab allinea tutti i gruppi gemelli
    - content.code.copy           # bottone copia-codice
  # Colori di base "deep purple" (vicini alla palette baseline M3); i token
  # esatti di Material Design 3 sono definiti in docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro

markdown_extensions:
  - admonition
  - pymdownx.details          # riquadri-scheda collassabili (??? / ???+)
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:           # tab di contenuto: === "Titolo"
      alternate_style: true
  - pymdownx.arithmatex:      # formule LaTeX
      generic: true

extra_css:
  - stylesheets/extra.css

# MathJax 3 — metodo ufficiale Material, ma SELF-HOSTED (niente CDN terzi,
# GDPR): il bundle e i font matematici sono vendorizzati in
# docs/javascripts/mathjax/ (da npm mathjax@3.2.2). NIENTE polyfill.io
# (compromesso). MathJax trova i font da solo, relativi al proprio script
# (output/chtml/fonts/woff-v2/).
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-mml-chtml.js
  # Ricorda quali rami della barra laterale l'utente ha aperto e li ripristina
  # dopo ogni cambio pagina (la instant navigation rigenera la sidebar). Stato
  # in sessionStorage: nessuna richiesta esterna, niente cookie (GDPR ok).
  - javascripts/nav-persist.js

plugins:
  - search:
      lang: it
  # awesome-pages NON introduce un blocco "nav:": la navigazione resta
  # generata dalla struttura di docs/. Serve solo a dare un titolo pulito
  # alle sottocartelle (sezioni a tendina) tramite i file ".pages"
  # (es. docs/letteratura/04-decadentismo/.pages -> title: Il Decadentismo),
  # perché di default MkDocs userebbe il nome della cartella ("04 decadentismo").
  - awesome-pages
