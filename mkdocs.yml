site_name: Sito di Studio
site_description: Appunti e materiale di studio personale, organizzati in moduli.
docs_dir: docs

# Nessun blocco "nav:": la navigazione è generata AUTOMATICAMENTE dalla
# struttura di docs/. Aggiungere una materia = creare una cartella.
# Aggiungere un argomento = creare un file .md dentro quella cartella.

theme:
  name: material
  language: it
  font:
    text: Inter            # corpo del testo: molto leggibile e pulito
    code: JetBrains Mono    # blocchi di codice
  features:
    - navigation.instant          # navigazione in stile SPA: niente ricaricamento pagina
    - navigation.instant.progress # sottile barra di avanzamento sui caricamenti lenti
    - navigation.tracking         # l'ancora nell'URL segue la sezione mentre scorri
    - navigation.tabs             # le materie (cartelle di primo livello) diventano tab in alto
    - navigation.tabs.sticky      # i tab restano fissi in alto durante lo scroll
    - navigation.sections
    - navigation.top              # bottone "torna su" con scroll morbido
    - navigation.footer           # link Precedente/Successivo in fondo alla pagina
    - navigation.indexes
    - toc.follow                  # la table of contents segue la lettura
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link           # cambiare un content-tab allinea tutti i gruppi gemelli
    - content.code.copy           # bottone copia-codice
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:           # tab di contenuto: === "Titolo"
      alternate_style: true
  - pymdownx.arithmatex:      # formule LaTeX
      generic: true

extra_css:
  - stylesheets/extra.css

# MathJax 3 — metodo ufficiale Material. NIENTE polyfill.io (compromesso).
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: it
